<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Escape 3D: Das Labor von Prof. Quotientia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1219;--panel:#181d29;--panel2:#212838;--line:#2e3750;--text:#eef1f7;--muted:#9aa3b8;--acc:#aecb35;--acc2:#3fd0e0;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;width:100%;position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-text-size-adjust:100%;background:#000;color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation}
.panel,#start{touch-action:pan-y}
.nn.lit,.gap.lit{background:#b6f0c0;border-radius:8px;outline:3px solid #22c55e}
.gap.good{border-style:solid;border-color:#22c55e;color:#15803d}
input{font:inherit;-webkit-user-select:text;user-select:text}
.btn{background:var(--panel2);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font-weight:500;min-height:46px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);color:#141a05;border-color:var(--acc);font-weight:700}
.btn.danger{background:#3a1820;border-color:#7a2a36}
.btn.small{padding:6px 12px;min-height:44px;min-width:44px;font-size:.95rem}
.btn:disabled{opacity:.4}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:none;gap:8px;align-items:center;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.65),transparent);pointer-events:none;flex-wrap:wrap}
#hud>*{pointer-events:auto}
#hud .team{font-weight:700;text-shadow:0 1px 3px #000}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:5px 10px;border-radius:9px;background:rgba(24,29,41,.85);border:1px solid var(--line)}
.timer.late{color:var(--bad)}
.inv{display:flex;gap:6px}
.item{background:rgba(24,29,41,.85);border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:1.2rem}
.flag{background:#5b1520;color:#ffd5da;border:1px solid #a33;padding:4px 10px;border-radius:8px;font-size:.8rem;font-weight:700}
#hud .tools{margin-left:auto;display:flex;gap:6px}
#hud .tools .btn{background:rgba(24,29,41,.85)}
/* Joystick & Hilfe */
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);display:none;z-index:5;pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(174,203,53,.7);transform:translate(-50%,-50%)}
#help{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:6;background:rgba(15,18,25,.8);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:.85rem;color:var(--muted);text-align:center;pointer-events:none;display:none;max-width:92vw}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.6);z-index:4;pointer-events:none;display:none}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(15,18,25,.92);border:1px solid var(--acc);border-radius:12px;padding:10px 16px;display:none;max-width:90vw;text-align:center}
/* Panels */
#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.55)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:680px;width:100%;max-height:90vh;overflow:auto;position:relative}
.panel h2{margin:.1em 0 .5em;font-size:1.35rem}
.panel .x{position:absolute;top:8px;right:8px;width:46px;height:46px;border-radius:50%;background:var(--panel2);font-size:1.1rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}
.note{background:#f4ecd4;color:#2b2416;border-radius:6px;padding:16px 18px;font-family:"Caveat",cursive;font-size:1.55rem;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.5);transform:rotate(-.6deg)}
.note.type{font-family:"Courier New",monospace;font-size:1rem;line-height:1.5;background:#fff;transform:none}
.mirror-txt{display:inline-block;transform:scaleX(-1);font-weight:700;font-size:1.4rem;letter-spacing:.06em;color:#cfe8ff}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em;font-weight:700}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.muted{color:var(--muted)}
/* Bücher */
.shelf{display:flex;gap:6px;justify-content:center;align-items:flex-end;background:linear-gradient(#3b2a1b,#2a1d12);padding:14px 10px 0;border-radius:10px;border-bottom:12px solid #1c130b;min-height:230px}
.book{width:70px;border-radius:5px 5px 2px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 4px;color:#fff;font-size:1.25rem;box-shadow:inset -6px 0 0 rgba(0,0,0,.25);transition:transform .15s}
.book.sel{transform:translateY(-14px);outline:3px solid var(--acc)}
.book .lt{font-size:1.8rem;font-weight:700;color:#ffdf6b;text-shadow:0 0 12px #ffb300;min-height:2.2rem}
/* Gläser */
.lab{display:flex;gap:18px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.glass{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:86px}
.glass.sel{border-color:var(--acc2);background:#173238}
.glass .lbl{font-size:1.3rem;font-weight:700}
/* Klavier */
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;background:#f6f0de;color:#222;border-radius:10px;padding:8px}
.legend div{display:flex;flex-direction:column;align-items:center;font-size:.95rem}.legend small{font-size:.66rem;color:#555;text-align:center}
.takte{display:grid;gap:8px;background:#f6f0de;color:#222;border-radius:10px;padding:10px}
.takt{display:flex;align-items:center;gap:6px;border-bottom:1px solid #bbb;padding-bottom:6px}.takt:last-child{border:none}
.takt .tn{font-size:.75rem;color:#666;width:48px}.takt .bar{width:3px;height:46px;background:#222;margin-left:4px}
.gap{min-width:46px;height:58px;border:2px dashed #b4232a;border-radius:8px;background:#fff;color:#b4232a;font-size:1.4rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.gap.act{outline:3px solid #a855f7}.gap.set{border-style:solid;color:#222}
.palette{display:flex;flex-wrap:wrap;gap:6px}.palette button{background:#f6f0de;color:#222;border-radius:10px;padding:4px 10px;min-height:56px}
/* Uhr / Keypad */
.clockui{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.ctrl{display:grid;grid-template-columns:auto auto auto;gap:8px;align-items:center}
.ctrl b{min-width:60px;text-align:center;font-size:1.4rem}
.display{display:flex;justify-content:center;gap:8px;margin:12px 0}
.display span{width:44px;height:60px;border-radius:10px;background:#0a0d12;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:var(--acc)}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{width:40px;height:16px;border-radius:8px;display:block}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:0 auto}
.keypad button{background:var(--panel2);border:1px solid var(--line);border-radius:14px;font-size:1.5rem;height:60px}
.keypad button:active{background:var(--acc);color:#141a05}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.screen{background:#071a10;border:2px solid #1f4d2e;border-radius:10px;padding:16px;font-family:"Courier New",monospace;color:#7dff9c}
.screen input{background:#0b2617;border:1px solid #2c7a45;color:#7dff9c;padding:10px;border-radius:6px;font-family:inherit;font-size:1.2rem;width:160px}
.hintlist{display:grid;gap:8px}
.hintlist button{text-align:left}
.hint{background:#2a2410;border:1px solid #5d4d17;border-radius:12px;padding:10px 14px;margin-top:8px}
/* Start */
#start{position:fixed;inset:0;z-index:40;overflow:auto;background:radial-gradient(900px 500px at 80% 0%,#1d2a1a,transparent 60%),radial-gradient(800px 500px at 0% 100%,#10283a,transparent 60%),#0f1219;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px}
#start .in{max-width:640px;width:100%}
.hero{text-align:center}.hero .big{font-size:3.6rem}.hero h1{margin:.1em 0;font-size:2rem}.hero h1 span{color:var(--acc)}
.form{display:grid;gap:12px;margin-top:14px}
.form label{display:grid;gap:5px;font-weight:500}
.form input,.form select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:10px;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.92rem}
.cert{border:2px solid var(--acc);border-radius:18px;padding:20px;background:linear-gradient(160deg,#1f2a12,var(--panel));text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--panel2);border-radius:12px;padding:8px}.stat b{display:block;font-size:1.4rem;color:var(--acc)}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0f1219;font-size:1.2rem}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:60;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="loading">🧪 Labor wird aufgebaut …</div>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="joy"><i></i></div>
<div id="cross"></div>
<div id="help"></div>
<div id="toast"></div>
<div id="ov"></div>
<div id="start"></div>

<script>
window.addEventListener('error',function(e){var l=document.getElementById('loading');if(l)l.innerHTML='⚠️ Der 3D-Raum konnte nicht starten.<br><small>'+(e.message||'')+'</small><br>Bitte Seite neu laden oder «Grafik: Einfach» wählen.'});
setTimeout(function(){var l=document.getElementById('loading');if(l)l.innerHTML='⏳ Das Laden dauert ungewöhnlich lange …<br><small>Bitte Seite neu laden. Funktioniert es weiterhin nicht: iPad auf iPadOS 16.4 oder neuer aktualisieren.</small>'},15000);
</script>

eln</u>.\xBB</div>'},window:{t:"Fenster",h:"<p>Draussen glitzern die Lichter der Stadt. Das Fenster ist fest verriegelt \u2013 hier geht es nicht raus.</p>"},laptop:{t:"Nachricht auf dem Laptop",h:'<div class="screen">&gt; Login erfolgreich.<br><br>&gt; Notiz an mich: Die gelbe Ziffer ist die Anzahl <b>Viertelstunden</b>, die mein Roboter Robbi mit <b>vollem Akku</b> durchh\xE4lt.</div>'}},jo=[{k:"buecher",t:"\u{1F4DA} B\xFCcherregal",h:["Unter etwas Grossem auf dem Boden schaut ein Zettel hervor. Tippt den Zettel selbst an.","Wandle alle Werte in Dezimalzahlen um: 5/6 = 0,833\u2026 und 17/20 = 85/100 = 0,85. Wenn die Reihenfolge stimmt, erscheint ein Wort \u2013 es ist eine Zahl."]},{k:"uhr",t:"\u{1F570}\uFE0F Wanduhr",h:["Bilder h\xE4ngen nicht immer nur zur Dekoration an der Wand.","35/60 l\xE4sst sich k\xFCrzen. Ein halber Tag hat 12 Stunden. Und 0,75 einer Stunde sind \u2026 Minuten."]},{k:"glaeser",t:"\u2697\uFE0F Gl\xE4ser",h:["Die Schreibtisch-Schublade braucht einen Schl\xFCssel. Darin steht, was mit den Gl\xE4sern zu tun ist.","Rechnet alles in Zw\xF6lftel um: 0,5 = 6/12, 25 % = 3/12. Die blaue Markierung liegt bei 11/12."]},{k:"gruen",t:"\u{1FA9E} Spiegel",h:["Die Schrift an der linken Wand ist spiegelverkehrt. Wo kann man sie richtig lesen? Geht dorthin und tippt den Gegenstand an.","Die Scheibe \xFCber dem Spiegel ist ein Kreismodell: Welcher Anteil ist poliert? Kehrwert: Z\xE4hler und Nenner vertauschen."]},{k:"gelb",t:"\u{1F4BB} Laptop & Roboter",h:["Das Passwort ist ein Geldbetrag. Habt ihr schon unter alle Dinge geschaut? Auch unter Pflanzen?","240 Fr. \u2212 25 % = 180 Fr. Davon nochmals 10 % abziehen. Danach: Robbis Akku zeigt 6 von 8 Balken f\xFCr 45 Minuten."]},{k:"klavier",t:"\u{1F3B9} Klavier",h:["Jeder Takt muss zusammen genau 1 Ganzes ergeben. Rechnet alle Notenwerte in Achtel um: Halbe = 4/8, Viertel = 2/8, Achtel = 1/8.",""]},{k:"mosaik",t:"\u{1F5BC}\uFE0F Bruchbild",h:["Das bunte Kunstwerk an der Wand ist ein Bruchbild. Wie gross ist jede
